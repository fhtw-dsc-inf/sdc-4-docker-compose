<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Redis: data in memory</title>
  <desc id="desc">A Python or FastAPI client sends commands to a Redis server. Redis holds keys and values in RAM, supporting different data types and expiration times. RDB and AOF can also persist data to disk.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/>
    </marker>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#163047}.muted{fill:#526a7d}.mono{font-family:Menlo,Consolas,monospace}.teal{fill:#087f8c}</style>
  </defs>
  <rect width="1100" height="680" rx="20" fill="#f8fbfc"/>
  <text x="44" y="35" font-size="13" font-weight="700" text-anchor="start" class="teal">REDIS · 01</text>
  <text x="44" y="76" font-size="30" font-weight="700" text-anchor="start" class="">One server, shared data</text>
  <text x="44" y="108" font-size="17" font-weight="400" text-anchor="start" class="muted">Redis is a network service. Clients use commands to access shared keys.</text>
  <rect x="44" y="180" width="235" height="176" rx="14" fill="#ffffff" stroke="#c8d9e2" stroke-width="1.5"/>
  <text x="68" y="218" font-size="22" font-weight="700" text-anchor="start" class="">Python / FastAPI</text>
  <text x="68" y="252" font-size="18" font-weight="400" text-anchor="start" class="">Redis client</text>
  <text x="68" y="286" font-size="17" font-weight="500" text-anchor="start" class="mono teal">SET · GET · INCR</text>
  <text x="68" y="322" font-size="16" font-weight="400" text-anchor="start" class="muted">TCP connection</text>
  <path d="M 279 236 H 350" fill="none" stroke="#087f8c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 350 306 H 279" fill="none" stroke="#087f8c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
  <text x="44" y="396" font-size="18" font-weight="700" text-anchor="start" class="">Separate process</text>
  <text x="44" y="425" font-size="17" font-weight="400" text-anchor="start" class="muted">Not a shared</text>
  <text x="44" y="450" font-size="17" font-weight="400" text-anchor="start" class="muted">Python dictionary.</text>
  <text x="44" y="486" font-size="17" font-weight="400" text-anchor="start" class="muted">Multiple clients see</text>
  <text x="44" y="511" font-size="17" font-weight="400" text-anchor="start" class="muted">the same data.</text>
  <rect x="350" y="150" width="706" height="392" rx="14" fill="#ffffff" stroke="#c8d9e2" stroke-width="1.5"/>
  <text x="378" y="190" font-size="24" font-weight="700" text-anchor="start" class="">Redis server</text>
  <text x="1028" y="190" font-size="18" font-weight="700" text-anchor="end" class="teal">RAM</text>
  <rect x="374" y="214" width="658" height="42" rx="7" fill="#edf5f8" stroke="#edf5f8" stroke-width="1.5"/>
  <text x="390" y="241" font-size="16" font-weight="700" text-anchor="start" class="">Key</text>
  <text x="577" y="241" font-size="16" font-weight="700" text-anchor="start" class="">Value</text>
  <text x="810" y="241" font-size="16" font-weight="700" text-anchor="start" class="">Type</text>
  <text x="975" y="241" font-size="16" font-weight="700" text-anchor="start" class="">TTL</text>
  <text x="390" y="292" font-size="15" font-weight="400" text-anchor="start" class="mono">demo:name</text>
  <text x="577" y="292" font-size="15" font-weight="400" text-anchor="start" class="mono">Ada</text>
  <text x="810" y="292" font-size="15" font-weight="400" text-anchor="start" class="">String</text>
  <text x="975" y="292" font-size="15" font-weight="700" text-anchor="start" class="teal">–</text>
  <path d="M 388 308 H 1020" stroke="#c8d9e2"/>
  <text x="390" y="345" font-size="15" font-weight="400" text-anchor="start" class="mono">demo:visits</text>
  <text x="577" y="345" font-size="15" font-weight="400" text-anchor="start" class="mono">42</text>
  <text x="810" y="345" font-size="15" font-weight="400" text-anchor="start" class="">String / counter</text>
  <text x="975" y="345" font-size="15" font-weight="700" text-anchor="start" class="teal">–</text>
  <path d="M 388 361 H 1020" stroke="#c8d9e2"/>
  <text x="390" y="398" font-size="15" font-weight="400" text-anchor="start" class="mono">demo:profile</text>
  <text x="577" y="398" font-size="15" font-weight="400" text-anchor="start" class="mono">name: Ada, role: tutor</text>
  <text x="810" y="398" font-size="15" font-weight="400" text-anchor="start" class="">Hash</text>
  <text x="975" y="398" font-size="15" font-weight="700" text-anchor="start" class="teal">–</text>
  <path d="M 388 414 H 1020" stroke="#c8d9e2"/>
  <text x="390" y="451" font-size="15" font-weight="400" text-anchor="start" class="mono">demo:session</text>
  <text x="577" y="451" font-size="15" font-weight="400" text-anchor="start" class="mono">token-123</text>
  <text x="810" y="451" font-size="15" font-weight="400" text-anchor="start" class="">String</text>
  <text x="975" y="451" font-size="15" font-weight="700" text-anchor="start" class="teal">60 s</text>
  <text x="378" y="517" font-size="16" font-weight="400" text-anchor="start" class="muted">TTL: the entire key disappears when it expires.</text>
  <path d="M 703 542 V 574" fill="none" stroke="#087f8c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="350" y="574" width="706" height="62" rx="10" fill="#dff2ee" stroke="#dff2ee" stroke-width="1.5"/>
  <text x="375" y="601" font-size="17" font-weight="700" text-anchor="start" class="">Optional disk persistence: RDB snapshots or an AOF log</text>
  <text x="375" y="625" font-size="15" font-weight="400" text-anchor="start" class="muted">Durability depends on the selected configuration.</text>
</svg>
